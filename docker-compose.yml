services:
  app:
    build: .
    image: identityhub-jira:latest
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      # SQLite file on the shared volume. busy_timeout eases brief locks when
      # the seed one-shot writes while the server holds a connection.
      DATABASE_URL: 'file:/data/app.db?busy_timeout=5000'
      # Demo-only secret (>=32 chars). Rotating it invalidates stored Jira tokens.
      APP_SECRET: 'identityhub-oasis-demo-secret-value!!'
      ALLOW_OPEN_SIGNUP: 'true'
      ALLOW_ADMIN: 'true'
      # Graders run the UI over http://localhost, so cookies must not be secure-only.
      COOKIE_SECURE: 'false'
      JIRA_CACHE_TTL_MS: '60000'
    volumes:
      - app-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # One-shot: `docker compose run --rm seed` populates the shared DB with demo
  # tenants, users, and fake Jira tickets. Safe to re-run (idempotent).
  seed:
    build: .
    image: identityhub-jira:latest
    entrypoint: ['./docker-entrypoint.sh']
    command: ['node', 'dist/scripts/seed-demo.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: 'file:/data/app.db?busy_timeout=5000'
      APP_SECRET: 'identityhub-oasis-demo-secret-value!!'
    volumes:
      - app-data:/data
    depends_on:
      app:
        condition: service_healthy

volumes:
  app-data:
